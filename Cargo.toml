[package]
name = "watch2"
version = "8.2.0"
edition = "2024"
license = "MIT"
description = "Hermes video analysis tool — Rust rewrite of hermes-video"
repository = "https://github.com/m1crodevil/hermes-video-rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["multipart", "json"] }


dotenvy = "0.15"
dirs = "6"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tempfile = "3"
which = "7"
av-scenechange = { version = "0.24", features = ["ffmpeg"] }


[dev-dependencies]
assert_cmd = "2"
predicates = "3"
wiremock = "0.6"
mockall = "0.13"

[package.metadata.tarpaulin]
exclude-files = ["tests/*", "examples/*", "src/main.rs"]
include-files = ["src/**/*.rs"]
out = ["html", "lcov"]
fail-under = 70

